name: Apple build and puzzle tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project metadata
        run: python3 scripts/check_project.py
      - name: Test puzzle engine
        run: swift test
      - name: Build iOS app without signing
        run: xcodebuild -project LumaLilt.xcodeproj -scheme LumaLilt -destination 'generic/platform=iOS Simulator' -derivedDataPath build build CODE_SIGNING_ALLOWED=NO
      - name: Build Release for iOS devices without signing
        run: xcodebuild -project LumaLilt.xcodeproj -scheme LumaLilt -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build-release build CODE_SIGNING_ALLOWED=NO
      - name: Build native app tests
        run: xcodebuild -project LumaLilt.xcodeproj -scheme LumaLilt -destination 'generic/platform=iOS Simulator' -derivedDataPath build build-for-testing CODE_SIGNING_ALLOWED=NO
      - name: Run native tests on an available iPhone simulator
        run: bash scripts/validate_mac.sh
      - name: Export native screenshots
        if: always()
        run: |
          for result in build/validation/run-*/Tests.xcresult; do
            if [ -d "$result" ]; then
              xcrun xcresulttool export attachments --path "$result" --output-path "$(dirname "$result")/screenshots"
            fi
          done
      - name: Keep test logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumalilt-native-test-results
          path: build/validation
          retention-days: 14
